apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  params:
    - name: repo-url
      type: string
      description: The git repo URL to clone from
    - name: branch
      type: string
      default: main
      description: The branch to clone
    - name: build-image
      type: string
      description: The image to build and push

  workspaces:
    - name: pipeline-workspace

  tasks:
    # --- CLONE TASK ---
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: pipeline-workspace

    # --- LINT TASK ---
    - name: lint
      runAfter:
        - clone
      taskRef:
        name: flake8
      params:
        - name: image
          value: "python:3.9-slim"
        - name: args
          value: ["--count","--max-complexity=10","--max-line-length=127","--statistics"]
      workspaces:
        - name: source
          workspace: pipeline-workspace

    # --- TESTS TASK (parallel with lint) ---
    - name: tests
      runAfter:
        - clone
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: pipeline-workspace
      params:
        - name: database_uri
          value: "sqlite:///test.db"
        - name: args
          value: "-v --with-spec --spec-color"

    # --- BUILD TASK (after lint + tests) ---
    - name: build
      runAfter:
        - tests
        - lint
      taskRef:
        name: buildah
        kind: ClusterTask
      workspaces:
        - name: source
          workspace: pipeline-workspace
      params:
        - name: IMAGE
          value: "$(params.build-image)"
