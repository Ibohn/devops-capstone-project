apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  params:
    - name: repo-url
      type: string
      description: The git repo URL to clone from
    - name: branch
      type: string
      default: main
      description: The branch to clone

  workspaces:
    - name: pipeline-workspace

  tasks:
    # --- CLONE TASK ---
    - name: clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: pipeline-workspace

    # --- LINT TASK ---
    - name: lint
      runAfter:
        - clone
      taskRef:
        name: flake8
      params:
        - name: image
          value: "python:3.9-slim"
        - name: args
          value: ["--count","--max-complexity=10","--max-line-length=127","--statistics"]
      workspaces:
        - name: source
          workspace: pipeline-workspace

